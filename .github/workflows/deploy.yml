name: CI y despliegue a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos necesarios para publicar en Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue en curso; no cancela el que ya esté publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) Pruebas y build. Bloquea el despliegue si algo está en rojo.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests (Vitest — motor y unidad)
        run: npm test

      - name: Instalar navegador de Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright — camino crítico)
        run: npm run test:e2e

      - name: Build de producción
        run: npm run build
        env:
          # Dominio propio: el sitio se sirve desde la raíz de app.legelbitcoin.com,
          # no desde /libro-cont/. Sobreescribe el `base` de vite.config.ts.
          VITE_BASE: /

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # 2) Despliegue del artefacto a GitHub Pages.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
